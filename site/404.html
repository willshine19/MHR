<script>
  // 404 页会出现在任意路径下，先把 <base> 设到站点根目录，下面的相对链接才指得对：
  // GitHub Pages 是 /<仓库名>/，Cloudflare 是 /
  (function () {
    var repo = location.pathname.split("/")[1];
    var base = document.createElement("base");
    base.href = location.hostname.endsWith(".github.io") && repo ? "/" + repo + "/" : "/";
    document.head.appendChild(base);
  })();
</script>
